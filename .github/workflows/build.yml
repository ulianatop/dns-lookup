name: Build JAR

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - run: javac NetworkInspector.java

      - run: jar cfe NetworkInspector.jar NetworkInspector NetworkInspector.class

      - uses: actions/upload-artifact@v7
        with:
          name: NetworkInspector
          path: NetworkInspector.jar
